name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            app/pnpm-lock.yaml
            cloudflare/worker/pnpm-lock.yaml
            landing-astro/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir app install --frozen-lockfile
      - run: pnpm --dir cloudflare/worker install --frozen-lockfile
      - run: pnpm --dir landing-astro install --frozen-lockfile
      - run: pnpm quality:format
      - run: pnpm docs:check
      - run: pnpm check
        working-directory: app
      - run: pnpm build
        working-directory: app
      - run: pnpm test:coverage
        working-directory: app
      - run: pnpm typecheck
        working-directory: cloudflare/worker
      - run: pnpm test:coverage
        working-directory: cloudflare/worker
      - run: pnpm check
        working-directory: landing-astro
      - run: pnpm quality:unused
      - run: pnpm quality:complexity
      - run: pnpm quality:duplication
      - run: pnpm quality:dependencies
      - run: pnpm quality:cycles
      - run: pnpm quality:suppressions
      - run: pnpm quality:hygiene
